<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Shake Christmas Tree Game</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="game-container">
        <div class="header">
            <div class="score-container">
                <span class="score-label">Score:</span>
                <span class="score" id="score">0</span>
            </div>
            <div class="shake-indicator" id="shakeIndicator">
                Shake your device!
            </div>
        </div>

        <div class="tree-container">
            <svg class="tree" viewBox="0 0 200 300" xmlns="http://www.w3.org/2000/svg">
                <!-- Tree trunk -->
                <rect x="85" y="200" width="30" height="100" fill="#5C4033" rx="3"/>

                <!-- Christmas tree triangular layers -->
                <polygon points="100,30 40,100 160,100" fill="#0F5132" stroke="#0A3D24" stroke-width="2"/>
                <polygon points="100,70 50,140 150,140" fill="#1A6B3F" stroke="#0F5132" stroke-width="2"/>
                <polygon points="100,110 60,180 140,180" fill="#2D8659" stroke="#1A6B3F" stroke-width="2"/>
                <polygon points="100,150 70,220 130,220" fill="#3FA46A" stroke="#2D8659" stroke-width="2"/>

                <!-- Star on top -->
                <polygon points="100,10 103,20 113,20 105,26 108,36 100,30 92,36 95,26 87,20 97,20" fill="#FFD700" stroke="#FFA500" stroke-width="1"/>

                <!-- Decorative ornaments (circles) -->
                <circle cx="75" cy="95" r="4" fill="#FF0000"/>
                <circle cx="125" cy="85" r="4" fill="#0000FF"/>
                <circle cx="100" cy="110" r="4" fill="#FFD700"/>
                <circle cx="70" cy="135" r="4" fill="#00FF00"/>
                <circle cx="130" cy="130" r="4" fill="#FF69B4"/>
                <circle cx="90" cy="160" r="4" fill="#FF0000"/>
                <circle cx="110" cy="165" r="4" fill="#0000FF"/>
                <circle cx="80" cy="190" r="4" fill="#FFD700"/>
                <circle cx="120" cy="195" r="4" fill="#00FF00"/>

                <!-- Garland (wavy line) -->
                <path d="M 50,140 Q 75,130 100,140 T 150,140" stroke="#FFD700" stroke-width="2" fill="none" opacity="0.7"/>
                <path d="M 60,180 Q 80,170 100,180 T 140,180" stroke="#FFD700" stroke-width="2" fill="none" opacity="0.7"/>
            </svg>

            <!-- Fruits container -->
            <div class="fruits-container" id="fruitsContainer"></div>

            <!-- Falling items container -->
            <div class="falling-items" id="fallingItems"></div>
        </div>

        <div class="instructions">
            <p>🎄 Shake your device to make ornaments fall!</p>
            <p>Tap ornaments to collect them</p>
        </div>

        <button class="reset-btn" id="resetBtn">Reset Game</button>
    </div>

    <script src="app.js"></script>
</body>
</html>
