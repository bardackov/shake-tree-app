<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Shake Christmas Tree Game</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="game-container">
        <div class="header">
            <div class="score-container">
                <span class="score-label">Score:</span>
                <span class="score" id="score">0</span>
            </div>
            <div class="shake-indicator" id="shakeIndicator">
                Shake your device!
            </div>
        </div>

        <div class="tree-container">
            <svg class="tree" viewBox="0 0 200 300" xmlns="http://www.w3.org/2000/svg">
                <!-- Tree trunk -->
                <rect x="85" y="200" width="30" height="100" fill="#8b7355" rx="3"/>

                <!-- Christmas tree triangular layers - Apple green tones -->
                <polygon points="100,30 40,100 160,100" fill="#1d7a4d" stroke="#166039" stroke-width="1.5" opacity="0.95"/>
                <polygon points="100,70 50,140 150,140" fill="#34c759" stroke="#1d7a4d" stroke-width="1.5" opacity="0.9"/>
                <polygon points="100,110 60,180 140,180" fill="#30d158" stroke="#34c759" stroke-width="1.5" opacity="0.85"/>
                <polygon points="100,150 70,220 130,220" fill="#32d74b" stroke="#30d158" stroke-width="1.5" opacity="0.8"/>

                <!-- Star on top - Apple gold -->
                <polygon points="100,10 103,20 113,20 105,26 108,36 100,30 92,36 95,26 87,20 97,20" fill="#ffd60a" stroke="#ff9f0a" stroke-width="1"/>

                <!-- Decorative ornaments - Apple system colors -->
                <circle cx="75" cy="95" r="3.5" fill="#ff3b30" opacity="0.9"/>
                <circle cx="125" cy="85" r="3.5" fill="#007aff" opacity="0.9"/>
                <circle cx="100" cy="110" r="3.5" fill="#ffd60a" opacity="0.9"/>
                <circle cx="70" cy="135" r="3.5" fill="#34c759" opacity="0.9"/>
                <circle cx="130" cy="130" r="3.5" fill="#ff2d55" opacity="0.9"/>
                <circle cx="90" cy="160" r="3.5" fill="#ff9f0a" opacity="0.9"/>
                <circle cx="110" cy="165" r="3.5" fill="#5ac8fa" opacity="0.9"/>
                <circle cx="80" cy="190" r="3.5" fill="#ffd60a" opacity="0.9"/>
                <circle cx="120" cy="195" r="3.5" fill="#34c759" opacity="0.9"/>

                <!-- Garland - subtle gold -->
                <path d="M 50,140 Q 75,130 100,140 T 150,140" stroke="#ffd60a" stroke-width="1.5" fill="none" opacity="0.5"/>
                <path d="M 60,180 Q 80,170 100,180 T 140,180" stroke="#ffd60a" stroke-width="1.5" fill="none" opacity="0.5"/>
            </svg>

            <!-- Fruits container -->
            <div class="fruits-container" id="fruitsContainer"></div>

            <!-- Falling items container -->
            <div class="falling-items" id="fallingItems"></div>
        </div>

        <div class="instructions">
            <p>🎄 Keep shaking to grow ornaments!</p>
            <p>Each ornament = 1 point when it falls</p>
        </div>

        <button class="reset-btn" id="resetBtn">Reset Game</button>
    </div>

    <script src="app.js"></script>
</body>
</html>
